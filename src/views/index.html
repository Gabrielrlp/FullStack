<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario doces da vovo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Formulario de sugestões para o doces da vovo</h1>
    </header>
    <main>
        <form action="">
            <label for="nome">Nome</label>
            <input type="text" name="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" name="email" placeholder="Digite seu email" required>

            <label for="sugestao">Sugestão</label>
            <textarea name="sugestao" id="sugestao" placeholder="Digite sua sugestão" required></textarea>

            <button type="submit"></button>
        </form>
    </main>
    <footer>

    </footer>
</body>
</html>
