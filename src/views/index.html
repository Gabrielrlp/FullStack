<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doces da vovo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Formulario para realização de sugestoes para os Doces da vovo!</h1>
    </header>

    <main>
        <form action="">
            <label for="nome"><span>*</span> Nome</label>
            <input type="text" id="nome" placeholder="Digite seunome" required>

            <label for="email"><span>*</span> E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="sugestao"><span>*</span> Sugestão</label>
            <textarea name="" id="sugestao" placeholder="Digite sua sugestão" required></textarea>
        </form>

        <button type="submit">Enviar</button>
    </main>

    <footer>

    </footer>

    <script src="script.js"></script>
    
</body>
</html>
