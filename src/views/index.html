<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario doces da vovo</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>Formulario de sugestões para o doces da vovo</h1>
    </header>
    <main>
        <form id="formulario">
            <!-- <label for="nome">Nome</label> -->
            <input type="text" id="nome" placeholder="Digite seu nome" required>
            <!-- <label for="email">E-mail</label> -->
            <input type="email" id="email" placeholder="Digite seu email" required>
            <!-- <label for="sugestao">Sugestão</label> -->
            <textarea name="pedido" id="pedido" placeholder="Digite sua sugestão" required></textarea>

            <button type="submit" id="botaoEnviar"></button>
        </form>

        <h2>Lista de pedidos</h2>
        <ul id="listarPedidos"></ul>
    </main>
    <footer>

    </footer>
    <script src="/js/script.js"></script>
</body>
</html>
