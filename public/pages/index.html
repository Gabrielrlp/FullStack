<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Doces da Vovó</title>
  </head>
  <body>
    <header>
      <div class="img">
        <img src="../assets/fotoHeader.png" alt="Logo" />
      </div>
      <div>
        <h1>Doces da Vovó</h1>
      </div>
      <div class="caixa3Header">
        <a href="#formulario"><button>Realizar pedido</button></a>
      </div>
    </header>
    <main>
      <section class="titulo-form">
        <h3>Faça seu pedido:</h3>
      </section>
      <form id="formulario">
        <section>
          <label for="nome"><span>*</span>Nome:</label>
          <input
            id="nome"
            required
            placeholder="Digite seu nome:"
            type="text"
          />
        </section>
        <section>
          <label for="email"><span>*</span>Email:</label>
          <input
            type="email"
            id="email"
            required
            placeholder="Digite seu email:"
          />
        </section>
        <section>
          <label for="pedido"><span>*</span>Pedido:</label>
          <textarea
            required
            placeholder="Digite seu pedido:"
            name="pedido"
            id="pedidos"
          ></textarea>
        </section>

        <section class="botao">
          <button id="button" type="submit" class="button">Enviar</button>
        </section>
        
        <p id="exibirMensagem"></p>
      </form>

      

      <h2>Lista de Pedidos</h2>
    <table>
      <thead>
        <tr>
          <th>Nome:</th>
          <th>Email:</th>
          <th>Pedido:</th>
          <th>Modifique:</th>
        </tr>
      </thead>

      <tbody id="listarPedidos"></tbody>
    </table>
    </main>
    <footer>
      <h2>
        - Site de pedidos Doces da Vovó - Desenvolvido por: Gabriel
        Rodrigues
      </h2>
    </footer>
    <script src="/js/script.js"></script>
  </body>
</html>
